# Render — web-сервис с постоянным диском.
# node server.js запускается как есть, файлы в data/ переживают перезапуск.
services:
  - type: web
    name: visitka
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # Держим мок-режим, пока не заданы настоящие ключи.
      - key: PAY_MODE
        value: mock
      # Порт задаёт сам Render, попадёт сюда автоматически.
      - key: PORT
        value: 10000
      - key: PUBLIC_URL
        generateValue: true
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
